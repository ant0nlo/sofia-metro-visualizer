name: Deploy app

# Publishes the app (index.html, manifest, service worker, icons) to GitHub Pages.
# Runs on every push to main, by hand, and after the nightly timetable update.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect the site files
        run: |
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          cp icons/*.png _site/icons/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
